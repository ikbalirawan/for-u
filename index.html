<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mau Ngedate Gak? 🥺</title>
    
    <!-- Google Fonts & Canvas Confetti -->
    <link href="[https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Mali:wght@600&display=swap](https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Mali:wght@600&display=swap)" rel="stylesheet">
    <script src="[https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js](https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js)"></script>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js](https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js)"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd1ff 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 1.5rem;
            animation: floatUp 6s linear infinite;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2.5rem 1.8rem;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(233, 90, 122, 0.2);
            text-align: center;
            max-width: 90%;
            width: 380px;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gif-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ff4b72;
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            font-family: 'Mali', cursive;
            line-height: 1.3;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 80px;
            position: relative;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Fredoka', sans-serif;
            outline: none;
        }

        .btn-mau {
            background: linear-gradient(45deg, #ff4b72, #ff758c);
            color: white;
            box-shadow: 0 6px 18px rgba(255, 75, 114, 0.4);
            z-index: 2;
        }

        .btn-mau:active {
            transform: scale(0.95);
        }

        .btn-gak {
            background: #e0e0e0;
            color: #666;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: absolute;
            z-index: 1;
            transition: all 0.2s ease-out;
        }

        /* Tampilan Hasil / Success */
        .success-screen {
            display: none;
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .success-screen h2 {
            color: #ff4b72;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-family: 'Mali', cursive;
        }

        .success-screen p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Background Hati Melayang -->
    <div class="hearts-bg" id="heartsBg"></div>

    <!-- Main Card -->
    <div class="card" id="mainCard">
        
        <!-- Layar Pertanyaan -->
        <div id="questionScreen">
            <div class="gif-container">
                <img id="gifImage" src="[https://media.giphy.com/media/cLS1cfxvGOPVpf9g3y/giphy.gif](https://media.giphy.com/media/cLS1cfxvGOPVpf9g3y/giphy.gif)" alt="Cute Bear">
            </div>
            <h1 id="mainTitle">Mau nggak nge-date sama aku? 🥺👉👈</h1>
            
            <div class="btn-group" id="btnGroup">
                <button class="btn-mau" id="btnMau" onclick="terima()">Mau! 🥰</button>
                <button class="btn-gak" id="btnGak">Nggak 😜</button>
            </div>
        </div>

        <!-- Layar Jawaban "Mau" -->
        <div class="success-screen" id="successScreen">
            <div class="gif-container">
                <img src="[https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif](https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif)" alt="Happy Cat">
            </div>
            <h2>Yaaay! 🎉❤️</h2>
            <p>I knew it! Sampai ketemu pas nge-date yaa! ✨</p>
            <p style="font-size: 0.9rem; color: #888; margin-top: 15px;">(Kirim screenshot ini ke WhatsApp aku ya! 😉)</p>
        </div>

    </div>

    <script>
        const btnGak = document.getElementById('btnGak');
        const btnMau = document.getElementById('btnMau');
        const btnGroup = document.getElementById('btnGroup');
        const questionScreen = document.getElementById('questionScreen');
        const successScreen = document.getElementById('successScreen');
        const gifImage = document.getElementById('gifImage');

        let scaleMau = 1;

        // Posisikan awal tombol 'Nggak'
        function initBtnGakPosition() {
            btnGak.style.right = '20px';
        }
        initBtnGakPosition();

        // Fungsi Memindahkan Tombol Nggak
        function moveBtnGak() {
            const cardRect = document.getElementById('mainCard').getBoundingClientRect();
            const btnRect = btnGak.getBoundingClientRect();

            // Hitung batas maksimum koordinat di dalam kartu
            const maxX = cardRect.width - btnRect.width - 30;
            const maxY = cardRect.height - btnRect.height - 30;

            const randomX = Math.max(15, Math.floor(Math.random() * maxX));
            const randomY = Math.max(15, Math.floor(Math.random() * maxY));

            btnGak.style.position = 'absolute';
            btnGak.style.left = `${randomX}px`;
            btnGak.style.top = `${randomY}px`;

            // Bikin tombol 'Mau' makin besar setiap tombol 'Nggak' coba di-klik
            scaleMau += 0.15;
            btnMau.style.transform = `scale(${scaleMau})`;
        }

        // Event listener untuk Desktop & Touch HP
        btnGak.addEventListener('mouseenter', moveBtnGak);
        btnGak.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveBtnGak();
        });
        btnGak.addEventListener('click', moveBtnGak);

        // Efek Suara Sederhana dengan Tone.js
        function playWinSound() {
            try {
                const synth = new Tone.Synth().toDestination();
                const now = Tone.now();
                synth.triggerAttackRelease("C5", "8n", now);
                synth.triggerAttackRelease("E5", "8n", now + 0.15);
                synth.triggerAttackRelease("G5", "8n", now + 0.3);
                synth.triggerAttackRelease("C6", "4n", now + 0.45);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Fungsi saat tombol "Mau" diklik
        function terima() {
            playWinSound();

            // Efek Konfeti Hati & Warna-warni
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff4b72', '#ff758c', '#ffffff', '#ffd1ff']
            });

            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 50,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 250);

            // Ganti Layar ke Tampilan Sukses
            questionScreen.style.display = 'none';
            successScreen.style.display = 'block';
        }

        // Elemen Hati Melayang di Background
        function createFloatingHearts() {
            const container = document.getElementById('heartsBg');
            const hearts = ['❤️', '💖', '✨', '🌸', '💕'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.animationDuration = `${4 + Math.random() * 4}s`;
                container.appendChild(heart);
            }
        }

        createFloatingHearts();
    </script>
</body>
</html>
